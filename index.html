<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090b16" />
  <title>Ram Charan — Sky Challenge</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #090b16; color: #fff; font-family: system-ui, Arial, sans-serif; }
    body { display: grid; place-items: center; padding: 16px; }
    .game-wrap { width: min(100%, 440px); text-align: center; }
    h1 { margin: 0 0 10px; font-size: clamp(22px, 6vw, 32px); letter-spacing: .5px; }
    .sub { margin: 0 0 14px; color: #c9cbe0; font-size: 13px; }
    .stage { position: relative; width: 100%; aspect-ratio: 9 / 16; max-height: 78vh; overflow: hidden; border: 2px solid #d6a94b; border-radius: 18px; background: linear-gradient(#172b55, #5a9ac1 58%, #e7c47c); box-shadow: 0 12px 40px #0009; }
    canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
    .controls { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
    button { border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 700; color: #111; background: #f4c45e; cursor: pointer; }
    button.secondary { background: #343951; color: white; }
    .hint { color: #bfc3d8; font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>
  <main class="game-wrap">
    <h1>RAM CHARAN · SKY CHALLENGE</h1>
    <p class="sub">Tap to fly • Dodge the golden pillars • Beat your best score</p>
    <div class="stage"><canvas id="game" width="432" height="768" aria-label="Flappy-style game"></canvas></div>
    <div class="controls">
      <button id="startBtn">Start / Restart</button>
      <button id="soundBtn" class="secondary">Sound: On</button>
    </div>
    <p class="hint">Tap the game, click, or press Space to fly. Audio starts after your first tap.</p>
  </main>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const photo = new Image();
  photo.src = 'images%20(4).jpeg';
  const music = new Audio('Jaragandi%20%E2%80%93%20Game%20Changer%20_%20Ram%20Charan%20Ringtone%20-%20MobCup.Com.Co.mp3');
  music.loop = true;
  music.volume = 0.45;

  let soundOn = true, running = false, gameOver = false;
  let player, pipes, score, best = Number(localStorage.getItem('ramCharanBest') || 0);
  let frame = 0;
  const gravity = 0.42, flap = -7.4, pipeW = 76, gap = 190, speed = 2.7;

  function reset() {
    player = { x: 105, y: 330, vy: 0, r: 29 };
    pipes = [];
    score = 0;
    frame = 0;
    running = true;
    gameOver = false;
    addPipe(W + 30);
  }
  function addPipe(x) {
    const top = 100 + Math.random() * 300;
    pipes.push({ x, top, scored: false });
  }
  function startMusic() {
    if (soundOn) music.play().catch(() => {});
  }
  function flapUp() {
    if (!running || gameOver) reset();
    player.vy = flap;
    startMusic();
  }
  function endGame() {
    running = false;
    gameOver = true;
    music.pause();
  }
  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#172b55');
    sky.addColorStop(.62, '#75b4ce');
    sky.addColorStop(1, '#e7c47c');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    // distant hills
    ctx.fillStyle = '#345d65';
    ctx.beginPath(); ctx.moveTo(0, 540);
    for (let x = 0; x <= W; x += 40) ctx.lineTo(x, 510 + Math.sin((x + frame) * .018) * 25);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    // clouds
    ctx.fillStyle = '#ffffffaa';
    for (let i = 0; i < 4; i++) {
      const x = ((i * 145 - frame * .35) % (W + 130) + W + 130) % (W + 130) - 60;
      const y = 95 + i % 2 * 105;
      ctx.beginPath(); ctx.arc(x, y, 22, 0, Math.PI * 2); ctx.arc(x + 24, y - 10, 28, 0, Math.PI * 2); ctx.arc(x + 52, y, 20, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#2b4b39'; ctx.fillRect(0, H - 38, W, 38);
    ctx.fillStyle = '#d6a94b'; ctx.fillRect(0, H - 42, W, 5);
  }
  function drawPlayer() {
    ctx.save();
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 4, 0, Math.PI * 2);
    ctx.fillStyle = '#f5c65b'; ctx.fill();
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.clip();
    if (photo.complete && photo.naturalWidth) {
      const scale = Math.max((player.r * 2) / photo.width, (player.r * 2) / photo.height);
      const sw = photo.width * scale, sh = photo.height * scale;
      ctx.drawImage(photo, player.x - sw / 2, player.y - sh / 2, sw, sh);
    } else {
      ctx.fillStyle = '#253b68'; ctx.fillRect(player.x - 30, player.y - 30, 60, 60);
      ctx.fillStyle = 'white'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center'; ctx.fillText('RC', player.x, player.y + 5);
    }
    ctx.restore();
  }
  function drawPipes() {
    pipes.forEach(p => {
      const bottomY = p.top + gap;
      const grad = ctx.createLinearGradient(p.x, 0, p.x + pipeW, 0);
      grad.addColorStop(0, '#8a5a16'); grad.addColorStop(.5, '#f5c65b'); grad.addColorStop(1, '#8a5a16');
      ctx.fillStyle = grad;
      ctx.fillRect(p.x, 0, pipeW, p.top);
      ctx.fillRect(p.x - 7, p.top - 22, pipeW + 14, 22);
      ctx.fillRect(p.x, bottomY, pipeW, H - bottomY - 42);
      ctx.fillRect(p.x - 7, bottomY, pipeW + 14, 22);
    });
  }
  function drawText() {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#17213b'; ctx.lineWidth = 5;
    ctx.font = 'bold 48px system-ui'; ctx.strokeText(score, W / 2, 72); ctx.fillText(score, W / 2, 72);
    ctx.font = 'bold 15px system-ui'; ctx.fillText('BEST ' + best, W / 2, 100);
    if (!running && !gameOver) {
      ctx.fillStyle = '#07101dcc'; ctx.fillRect(34, 285, W - 68, 150);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 27px system-ui'; ctx.fillText('SKY CHALLENGE', W / 2, 337);
      ctx.font = '16px system-ui'; ctx.fillText('Tap to start flying', W / 2, 375);
    }
    if (gameOver) {
      ctx.fillStyle = '#07101ddd'; ctx.fillRect(34, 270, W - 68, 190);
      ctx.fillStyle = '#f5c65b'; ctx.font = 'bold 30px system-ui'; ctx.fillText('GAME OVER', W / 2, 325);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 21px system-ui'; ctx.fillText('Score: ' + score, W / 2, 365);
      ctx.font = '15px system-ui'; ctx.fillText('Tap to try again', W / 2, 405);
    }
  }
  function hitTest(p) {
    const bottomY = p.top + gap;
    const withinX = player.x + player.r > p.x && player.x - player.r < p.x + pipeW;
    return withinX && (player.y - player.r < p.top || player.y + player.r > bottomY);
  }
  function update() {
    if (running) {
      frame++;
      player.vy += gravity;
      player.y += player.vy;
      if (frame % 105 === 0) addPipe(W + 20);
      pipes.forEach(p => {
        p.x -= speed;
        if (!p.scored && p.x + pipeW < player.x) {
          p.scored = true; score++;
          if (score > best) { best = score; localStorage.setItem('ramCharanBest', best); }
        }
        if (hitTest(p)) endGame();
      });
      pipes = pipes.filter(p => p.x + pipeW > -20);
      if (player.y - player.r < 0 || player.y + player.r > H - 42) endGame();
    }
    drawBackground(); drawPipes();
    if (player) drawPlayer();
    drawText();
    requestAnimationFrame(update);
  }
  document.getElementById('startBtn').addEventListener('click', () => { reset(); flapUp(); });
  document.getElementById('soundBtn').addEventListener('click', e => {
    soundOn = !soundOn;
    e.currentTarget.textContent = 'Sound: ' + (soundOn ? 'On' : 'Off');
    if (!soundOn) music.pause(); else if (running) startMusic();
  });
  canvas.addEventListener('pointerdown', flapUp);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flapUp(); }
  });
  reset(); running = false; player.vy = 0;
  update();
})();
</script>
</body>
</html>
